# KAI Wellness Retreats - full stack
#   cp .env.example .env   # then fill in every empty secret
#   docker compose up --build
# AI features need GROQ_API_KEY (free at https://console.groq.com/keys).
# Site: http://localhost:3536   Founder portal: http://localhost:3536/portal   API: http://localhost:8972/docs
# (Container-internal ports stay 3000/8000; only the host-side ports are remapped.)
# Host port busy? Set FRONTEND_PORT / BACKEND_PORT in .env (e.g. FRONTEND_PORT=3001).
services:
  # ---------------------------------------------------------------------------
  # 1. KAI FastAPI Backend Sidecar & Clinical RAG Engine
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kai-backend
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/kai_sanctuary.db}
      # SQLite: a single worker avoids concurrent init/migration races on startup.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-kai_admin_2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kai_sanctuary_jwt_secret_change_in_prod_2026}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-whsec_email_kai_sanctuary_2026}
      CIRIUM_WEBHOOK_SECRET: ${CIRIUM_WEBHOOK_SECRET:-whsec_cirium_kai_2026}
      EXPEDIA_WEBHOOK_SECRET: ${EXPEDIA_WEBHOOK_SECRET:-whsec_expedia_kai_2026}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-kai_whatsapp_verify_token_2026}
    ports:
      - "${BACKEND_PORT:-8972}:8000"
    volumes:
      - kai_data:/app/data
    restart: unless-stopped
    networks:
      - kai-network

  # ---------------------------------------------------------------------------
  # 2. KAI Next.js Frontend & Founder Sanctuary Portal
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FASTAPI_BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3536}
    container_name: kai-frontend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      FASTAPI_BACKEND_URL: http://backend:8000
      # Portal gate (proxy.ts) and server-side admin calls; never exposed to the browser.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-kai_admin_2026}
    ports:
      - "${FRONTEND_PORT:-3536}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kai-network

volumes:
  kai_data:

networks:
  kai-network:
    driver: bridge
